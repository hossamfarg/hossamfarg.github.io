<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carriage Out — Royal Pharaonic Edition</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="game-container">
    <header class="royal-header">
      <div class="level-info">
        <span class="level-title" id="stage-indicator">Campaign • Act 1</span>
        <span class="level-name" id="level-title-text">Pharaoh's Gate</span>
      </div>
      <div class="controls-row">
        <button class="btn-icon active" id="btn-music" title="Toggle Pharaonic Soundtrack">
          🎵 <span id="music-lbl">On</span>
        </button>
        <button class="btn-icon" id="btn-sound" title="Toggle Sound FX">🔊</button>
        <button class="btn-icon" id="btn-restart" title="Restart Level">↺</button>
      </div>
    </header>

    <div class="station-bar">
      <span class="station-label">👑 ROYAL CAROUSEL STATION</span>
      <div class="station-actions">
        <button class="queue-btn" id="btn-rotate-queue" title="Cycle front passenger to back">↻ Rotate [R]</button>
        <button class="queue-btn" id="btn-auto-carousel" title="Toggle continuous conveyor">🎠 Auto: OFF</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <footer class="booster-dock">
      <button class="booster-btn" id="btn-shuffle">
        <span class="booster-icon">🔀</span>
        <span class="booster-name">Flip Axis</span>
        <span class="booster-count" id="count-shuffle">3 left</span>
      </button>
      <button class="booster-btn" id="btn-vip">
        <span class="booster-icon">✨</span>
        <span class="booster-name">VIP Pull</span>
        <span class="booster-count" id="count-vip">2 left</span>
      </button>
      <button class="booster-btn" id="btn-slot">
        <span class="booster-icon">➕</span>
        <span class="booster-name">+1 Bay</span>
        <span class="booster-count" id="count-slot">1 left</span>
      </button>
    </footer>

    <div class="overlay" id="modal-win">
      <div class="card">
        <div class="card-emblem">👑</div>
        <h2>ROYAL CLEAR!</h2>
        <p>Every royal chariot has departed the temple courtyard in triumph!</p>
        <button class="action-btn" id="btn-next-level">Next Royal Level →</button>
      </div>
    </div>

    <div class="overlay" id="modal-lose">
      <div class="card card-danger">
        <div class="card-emblem">⚠️</div>
        <h2>COURTYARD JAMMED!</h2>
        <p>All holding bays are occupied and the gate passenger cannot board.</p>
        <button class="action-btn" id="btn-retry-lose">Try Level Again ↺</button>
        <button class="action-btn secondary" id="btn-free-bay">+ Unlock Extra Bay & Continue</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
